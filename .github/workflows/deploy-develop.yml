name: Deploy DEV to S3

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: 2. Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. 패키지 설치 및 리액트 빌드 (.env 환경변수 주입)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_S3_BUCKET_URL: ${{ secrets.VITE_S3_BUCKET_URL }}
        run: |
          npm install
          npm run build

      - name: 4. AWS 인증 설정 (DEV)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ap-northeast-2

      - name: 5. DEV S3 버킷에 업로드
        run: aws s3 sync ./dist s3://archreactor-dev --delete
